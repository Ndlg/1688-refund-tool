<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>1688 退款详情工具</title>
  <style>
    body {
      min-width: 760px;
      max-width: 1100px;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f6f8fb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c8d3df;
      border-radius: 6px;
      padding: 8px;
      color: #172033;
      background: #fff;
      font: 13px/1.45 Consolas, "Microsoft YaHei", monospace;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      height: 32px;
      border: 0;
      border-radius: 5px;
      padding: 0 12px;
      background: #1677ff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #eef3f9;
      color: #1d334f;
      border: 1px solid #c8d3df;
    }

    .stats {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      color: #5d6a7b;
      font-size: 12px;
    }

    .result-list {
      display: grid;
      gap: 6px;
      max-height: 520px;
      margin-top: 10px;
      overflow: auto;
    }

    .result {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border: 1px solid #e0e7ef;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
    }

    .result code {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result a {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #0b63ce;
      text-decoration: none;
    }

    .hint {
      margin: 8px 0 0;
      color: #667085;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>1688 退款详情工具</h1>
  <p><a href="workbench.html">打开待收货与签收工作台</a></p>

  <label for="saleTemplate">售中详情模板</label>
  <input id="saleTemplate" placeholder="例如 assureRefundDetail.htm 的成功详情页 URL">

  <label for="aftersaleTemplate">售后详情模板</label>
  <input id="aftersaleTemplate" placeholder="例如 aftersaleDetail.htm 的成功详情页 URL">

  <label for="refundIds">退款单号</label>
  <textarea id="refundIds" placeholder="点击“扫描当前页”，或按「退款单号,售中」逐行粘贴"></textarea>

  <label for="openDelay">打开间隔</label>
  <input id="openDelay" type="number" min="1000" step="500" value="3000" placeholder="单位：毫秒">
  <p class="hint">建议至少 3000 毫秒；被限制时调到 5000-10000 毫秒。</p>

  <div class="buttons">
    <button id="scanPage">扫描当前页</button>
    <button id="generate">生成链接</button>
    <button id="copyLinks" class="secondary">复制链接</button>
    <button id="openAll" class="secondary">按间隔打开</button>
    <button id="stopOpen" class="secondary">停止打开</button>
    <button id="clear" class="secondary">清空</button>
  </div>

  <div class="stats">
    <span>单号：<b id="idCount">0</b></span>
    <span>链接：<b id="linkCount">0</b></span>
    <span id="status">就绪</span>
  </div>

  <div id="results" class="result-list"></div>

  <p class="hint">扩展只扫描退款单号和售中/售后，不点击退款处理按钮。不要用错误页 URL 当模板。</p>

  <script src="popup.js"></script>
</body>
</html>
